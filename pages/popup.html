<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>QuickSwitcher</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      width: 300px;
      margin: 0;
      padding: 14px 16px 12px;
      font: 13px/1.5 system-ui, "Segoe UI", -apple-system, sans-serif;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 15px;
    }
    .subtitle {
      margin: 0 0 14px;
      min-height: 16px;
      font-size: 12px;
      color: #64748b;
    }
    .setting {
      margin: 0 0 14px;
    }
    .setting > .row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .setting > .row + .options {
      margin-top: 8px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .option {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
    }
    .option[data-selected="true"] {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.08);
    }
    .option input {
      margin: 2px 0 0;
      accent-color: #2563eb;
    }
    .option .text {
      display: block;
    }
    .option .text strong {
      display: block;
      font-size: 13px;
    }
    .option .text span {
      display: block;
      margin-top: 1px;
      font-size: 12px;
      font-weight: 400;
      color: #64748b;
    }
    .status {
      min-height: 16px;
      margin: 0 0 4px;
      font-size: 12px;
      color: #2563eb;
    }
    .select-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
    }
    .select-row + .select-row {
      border-top: 1px solid #e2e8f0;
    }
    .select-row select {
      font: inherit;
      padding: 3px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      accent-color: #2563eb;
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
    }
    footer a {
      color: #2563eb;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
    @media (prefers-color-scheme: dark) {
      .subtitle,
      .option .text span,
      footer {
        color: #94a3b8;
      }
      .option {
        border-color: #334155;
      }
      .option[data-selected="true"] {
        border-color: #3b82f6;
        background: rgba(59, 130, 246, 0.12);
      }
      .select-row + .select-row {
        border-color: #334155;
      }
      .select-row select {
        border-color: #334155;
      }
      footer {
        border-color: #334155;
      }
      footer a,
      .status {
        color: #60a5fa;
      }
    }
  </style>
</head>
<body>
  <h1>QuickSwitcher</h1>
  <p class="subtitle" id="subtitle"></p>
  <div class="setting">
    <label class="row">
      <input type="checkbox" id="enabled">
      <span id="enabled-label"></span>
    </label>
  </div>
  <div class="setting">
    <div class="row" id="mode-label"></div>
    <div class="options">
      <label class="option" id="option-popup">
        <input type="radio" name="specialHostMode" value="popup">
        <span class="text">
          <strong id="popup-title"></strong>
          <span id="popup-desc"></span>
        </span>
      </label>
      <label class="option" id="option-borrow">
        <input type="radio" name="specialHostMode" value="borrow">
        <span class="text">
          <strong id="borrow-title"></strong>
          <span id="borrow-desc"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="setting">
    <div class="row" id="panel-label"></div>
    <div class="select-row">
      <label for="panelTabCount" id="panel-count-label"></label>
      <select id="panelTabCount">
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="7">7</option>
      </select>
    </div>
  </div>
  <div class="setting">
    <div class="row" id="thumbnail-label"></div>
    <div class="select-row">
      <label for="thumbnailLimit" id="thumbnail-limit-label"></label>
      <select id="thumbnailLimit">
        <option value="12">12</option>
        <option value="20">20</option>
        <option value="24">24</option>
        <option value="36">36</option>
      </select>
    </div>
    <div class="select-row">
      <label for="thumbnailTtlHours" id="thumbnail-ttl-label"></label>
      <select id="thumbnailTtlHours">
        <option value="2">2h</option>
        <option value="6">6h</option>
        <option value="12">12h</option>
      </select>
    </div>
  </div>
  <p class="status" id="status"></p>
  <footer>
    <span id="version"></span>
    <a href="https://github.com/POLARIS0824/Quick-Switcher" target="_blank" rel="noreferrer">GitHub</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
