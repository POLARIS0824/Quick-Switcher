<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AltQ Tab Switcher</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: #f8fafc;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b1220; }
    }
    main {
      margin: auto;
      padding: 40px 48px;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.86);
      border-radius: 18px;
      box-shadow: 0 18px 52px rgba(15, 23, 42, 0.14);
    }
    @media (prefers-color-scheme: dark) {
      main {
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.4);
      }
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #172033;
    }
    @media (prefers-color-scheme: dark) {
      h1 { color: #f8fafc; }
    }
    p.subtitle {
      margin: 0 0 26px;
      font-size: 13px;
      color: rgba(23, 32, 51, 0.62);
    }
    @media (prefers-color-scheme: dark) {
      p.subtitle { color: rgba(248, 250, 252, 0.6); }
    }
    label.setting {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #172033;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      label.setting { color: #f8fafc; }
    }
    label.setting input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
    }
    p.hint {
      margin: 22px 0 0;
      font-size: 12px;
      line-height: 1.6;
      color: rgba(23, 32, 51, 0.55);
    }
    @media (prefers-color-scheme: dark) {
      p.hint { color: rgba(248, 250, 252, 0.52); }
    }
    p.status {
      margin: 10px 0 0;
      font-size: 12px;
      min-height: 16px;
      color: #2563eb;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">AltQ Tab Switcher</h1>
    <p class="subtitle" id="subtitle"></p>
    <label class="setting">
      <input type="checkbox" id="enabled">
      <span id="enabled-label"></span>
    </label>
    <p class="status" id="status"></p>
    <p class="hint" id="hint"></p>
  </main>
  <script src="../content/panel.js"></script>
  <script src="page-bridge.js"></script>
  <script src="options.js"></script>
</body>
</html>
